# manifests/copilot.toml — GitHub Copilot CLI detection manifest
#
# For the minimal parser (scripts/lib/manifest.sh). Only single-line key = "value" entries are supported.
# pattern is an ERE passed to grep -E verbatim, with no escape processing.
# region: full | last_line | top_non_empty_lines(N) | bottom_lines(N)
# Rules are evaluated top to bottom and the first match wins (keep them ordered blocked → working → idle).
#
# Captured against GitHub Copilot CLI 1.0.98. Screen layout (bottom of the pane):
#   ~/path [⎇ main]                              Session: 0.2 AIC used   <- status line
#   ────────────────────────────────────────────
#   ❯                                                                     <- prompt
#   ────────────────────────────────────────────
#   ◉ Working · 71 B esc interrupt                           Auto → …    <- last line while a turn runs
#   ← open sidebar · Interactive · Manual Approval · / commands · ? help  <- last line when idle
# Approval requests are drawn in a box:
#   │ Do you want to create /path/file?         │
#   │ ❯ 1. Yes                                  │
#   │   2. Yes, and don't ask again for …       │
#   │   3. No, and tell Copilot what to do differently (Esc to stop) │
#   │ ↑/↓ to navigate · enter to select · esc to cancel │

agent = "copilot"

# Fingerprints identifying this pane as Copilot CLI (any single match qualifies).
# Manifests are tried in file-name order, so every fingerprint must be unique to Copilot.
[[identify]]
region = "full"
pattern = "Copilot v[0-9]+\.[0-9]|GitHub Copilot|No, and tell Copilot|open sidebar · |Session: [0-9.]+ AIC used"

# Waiting on a user decision: file/command approvals, the folder-trust dialog
[[rule]]
status = "blocked"
region = "bottom_lines(20)"
pattern = "Do you want to|Do you trust|No, and tell Copilot|↑/↓ to navigate · enter to select|❯ 1\."

# Working: the last line reads "◉ Working esc edit prompt" / "◎ Working · 154 B esc interrupt" (the spinner glyph cycles)
[[rule]]
status = "working"
region = "bottom_lines(3)"
pattern = "Working.*esc (interrupt|edit prompt)"

# Waiting for input: the help footer is shown and the prompt line is a bare "❯"
[[rule]]
status = "idle"
region = "bottom_lines(4)"
pattern = "/ commands · \? help|^❯[[:space:]]*$"
